name: misskey_emoji
version: 2.0.0-beta.1
homepage: https://librarylibrarian.com
environment:
  sdk: ">=3.10.0 <4.0.0"
  # 3.38.0の同梱Dartは3.10.0-290.4.betaで、プレリリースは>=3.10.0を満たさない。
  # Dart 3.10.0の正式版を積むのは3.38.1から。
  flutter: ">=3.38.1"
description: A Flutter library for caching, resolving, and searching Misskey custom emoji metadata.
dependencies:
  drift: ^2.34.4
  flutter:
    sdk: flutter
  meta: ^1.15.0
  misskey_client: ^1.0.0-beta.6
  path: ^1.9.0
dev_dependencies:
  # sqlite3のbuild hooksとAOT起動が非互換なため、コード生成は--force-jitで実行する。
  build_runner: ^2.15.1
  # SDK間で生成物を一致させるため、rangeではなく厳密に固定する。
  drift_dev: 2.34.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  pedantic_mono: ^1.33.0
  pubspec_dependency_sorter: ^1.0.5
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
repository: https://github.com/LibraryLibrarian/misskey_emoji
issue_tracker: https://github.com/LibraryLibrarian/misskey_emoji/issues
topics:
  - misskey
  - emoji
  - cache
  - resolver
  - catalog
