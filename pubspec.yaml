name: misskey_emoji
version: 0.0.1-beta
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"
description: A library to cache Misskey MFM emojis for easier use.
dependencies:
  flutter:
    sdk: flutter
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  json_annotation: ^4.8.1
  misskey_api_core: ^1.0.0
dev_dependencies:
  build_runner: ^2.4.6
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator: ^3.3.0
  json_serializable: ^6.7.1
  pubspec_dependency_sorter: ^1.0.5
platforms:
  android:
  ios:
  linux:
  web:
  macos:
  windows:
repository: https://github.com/LibraryLibrarian/misskey_emoji
issue_tracker: https://github.com/LibraryLibrarian/misskey_emoji/issues
topics:
  - misskey
  - emoji
  - cache
  - resolver
  - catalog
