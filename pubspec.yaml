name: misskey_emoji
version: 1.0.0
homepage: https://librarylibrarian.com
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"
description: A Flutter library for caching and resolving Misskey custom emoji metadata with persistent Isar storage, search, and efficient retrieval mechanisms.
dependencies:
  flutter:
    sdk: flutter
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  misskey_client: ^1.0.0-beta.5
dev_dependencies:
  build_runner: ^2.4.6
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator: ^3.3.2
  pedantic_mono: ^1.33.0
  pubspec_dependency_sorter: ^1.0.5
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
repository: https://github.com/LibraryLibrarian/misskey_emoji
issue_tracker: https://github.com/LibraryLibrarian/misskey_emoji/issues
topics:
  - misskey
  - emoji
  - cache
  - resolver
  - catalog
